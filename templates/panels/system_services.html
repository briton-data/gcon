<div class="gcon-panel h-100">

    <div class="gcon-panel-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-hdd-stack me-2"></i>System Services</h5>
    </div>

    <div class="gcon-panel-body" id="system-services-body" style="min-height:auto;">

        <div class="gcon-service-list" id="system-services-list">

            <div class="gcon-service-row" id="svc-row-coordinator">
                <span class="gcon-service-name"><span class="dot" id="svc-dot-coordinator"></span>Coordinator</span>
                <span class="gcon-service-value" id="svc-val-coordinator">--</span>
            </div>

            <div class="gcon-service-row" id="svc-row-scheduler">
                <span class="gcon-service-name"><span class="dot" id="svc-dot-scheduler"></span>Scheduler</span>
                <span class="gcon-service-value" id="svc-val-scheduler">--</span>
            </div>

            <div class="gcon-service-row" id="svc-row-receipts">
                <span class="gcon-service-name"><span class="dot" id="svc-dot-receipts"></span>Receipts Service</span>
                <span class="gcon-service-value" id="svc-val-receipts">--</span>
            </div>

            <div class="gcon-service-row" id="svc-row-storage">
                <span class="gcon-service-name"><span class="dot" id="svc-dot-storage"></span>Storage</span>
                <span class="gcon-service-value" id="svc-val-storage">--</span>
            </div>

            <div class="gcon-service-row" id="svc-row-heartbeat">
                <span class="gcon-service-name"><span class="dot" id="svc-dot-heartbeat"></span>Heartbeat</span>
                <span class="gcon-service-value muted" id="svc-val-heartbeat">--</span>
            </div>

        </div>

        <a href="#" class="gcon-panel-link d-inline-block mt-2" data-tab="cluster">View all services &rarr;</a>

    </div>

</div>
