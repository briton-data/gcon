<!--
    Cluster events rolled up by type and source, not one row per event.
    A health check that flaps every few seconds is one line with a count.
    The full chronological stream is still on the Events page.
-->
<div class="gcon-panel h-100" id="event-groups-panel" data-scope-panel="events">
    <div class="gcon-panel-header d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-0"><i class="bi bi-activity me-2"></i>Event groups</h5>
            <div class="gcon-scope-note" id="evg-note"></div>
        </div>
        <a href="#" class="gcon-panel-link" data-tab="events">All events &rarr;</a>
    </div>
    <div class="gcon-panel-body" style="min-height:auto;">
        <div class="gcon-evg-list" id="evg-list"></div>
        <div class="text-secondary small mt-2" id="evg-foot"></div>
    </div>
</div>
