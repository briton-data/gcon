<!--
    Open incidents, worst first: severity, impact, who owns it, and how
    long ago it was detected. Source is /management/incidents (the same
    deduplicated incident store as the Incidents page -- one continuous
    problem is one row, however many sampling ticks it spans). Rows are
    built by dashboard.js with textContent.
-->
<div class="gcon-panel" id="incidents-overview-panel" data-scope-panel="incidents">
    <div class="gcon-panel-header d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Incidents</h5>
            <div class="gcon-scope-note" id="inc-ov-note"></div>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="text-secondary small" id="inc-ov-resolved"></span>
            <span class="badge bg-success" id="inc-ov-count">0</span>
            <a href="#" class="gcon-panel-link" data-tab="incidents">All incidents &rarr;</a>
        </div>
    </div>
    <div class="gcon-panel-body" style="min-height:auto;">
        <div class="gcon-inc-list" id="inc-ov-list"></div>
    </div>
</div>
