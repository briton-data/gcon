<!-- Per-customer load: aggregate counts per organization, no job rows -->
<div class="gcon-panel">
    <div class="gcon-panel-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-people me-2"></i>Customer load</h5>
        <span class="text-secondary small">Busiest organizations first</span>
    </div>
    <div class="gcon-panel-body" style="min-height:auto;">
        <table class="table table-sm gcon-table mb-0">
            <thead><tr><th>Organization</th><th>Pending</th><th>Oldest pending</th><th>Running</th><th>Completed</th><th>Failed</th><th>Cancelled</th><th>Failure rate</th></tr></thead>
            <tbody id="cust-body"></tbody>
        </table>
    </div>
</div>
