<!-- Active incidents (rules evaluated by the coordinator each sample) -->
<div class="gcon-panel mb-3">
    <div class="gcon-panel-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Active incidents</h5>
        <span class="text-secondary small" id="inc-open-note"></span>
    </div>
    <div class="gcon-panel-body" style="min-height:auto;">
        <table class="table table-sm gcon-table mb-0">
            <thead><tr><th>Severity</th><th>Incident</th><th>Subject</th><th>First seen</th><th>Last seen</th></tr></thead>
            <tbody id="inc-open-body"></tbody>
        </table>
    </div>
</div>
<div class="gcon-panel">
    <div class="gcon-panel-header"><h5 class="mb-0"><i class="bi bi-check2-circle me-2"></i>Recently resolved</h5></div>
    <div class="gcon-panel-body" style="min-height:auto;">
        <table class="table table-sm gcon-table mb-0">
            <thead><tr><th>Severity</th><th>Incident</th><th>Subject</th><th>First seen</th><th>Resolved</th></tr></thead>
            <tbody id="inc-resolved-body"></tbody>
        </table>
    </div>
</div>
