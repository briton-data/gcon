<!-- Workers: every worker once, by who hosts it and by customer. Counts only, no per-worker rows except the ones needing attention. -->
<div class="gcon-panel" id="workers-panel">
    <div class="gcon-panel-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-cpu me-2"></i>Workers</h5>
        <span class="text-secondary small" id="workers-headline">--</span>
    </div>
    <div class="gcon-panel-body" style="min-height:auto;">
        <div id="workers-attention" class="mb-3"></div>

        <table class="table table-sm gcon-table mb-3">
            <thead><tr>
                <th>Hosted by</th>
                <th class="text-center">Total</th>
                <th class="text-center">Working</th>
                <th class="text-center">Idle</th>
                <th class="text-center">Offline</th>
                <th class="text-center" title="Quarantined: the platform's own sign that a worker may be compromised (its signed results failed to verify, or its sandbox evidence did not match). It takes no new jobs.">Quarantined</th>
            </tr></thead>
            <tbody id="workers-kinds-body"><tr><td colspan="6" class="text-center text-secondary">Loading&hellip;</td></tr></tbody>
        </table>

        <table class="table table-sm gcon-table mb-0">
            <thead><tr>
                <th>Customer</th>
                <th class="text-center" title="The customer's own machines">Own</th>
                <th class="text-center" title="GCON hosted workers leased to this customer">GCON-leased</th>
                <th class="text-center">Working</th>
                <th class="text-center">Idle</th>
                <th class="text-center">Offline</th>
                <th class="text-center">Quarantined</th>
            </tr></thead>
            <tbody id="workers-customers-body"></tbody>
        </table>
        <div class="small text-secondary mt-2" id="workers-customers-note"></div>
    </div>
</div>
