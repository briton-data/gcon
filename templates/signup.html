<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account — GCON</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>

<body class="gcon-login-body">

    <div class="gcon-login-card">

        <div class="text-center mb-4">
            <i class="bi bi-diagram-3-fill" style="font-size: 2rem; color: var(--primary);"></i>
            <h4 class="mt-2 mb-0 text-white">GCON</h4>
            <div class="text-secondary small">Create an account</div>
        </div>

        <div id="signup-error" class="alert alert-danger d-none"></div>
        <div id="signup-success" class="alert alert-success d-none"></div>

        <div class="mb-3">
            <label class="form-label text-secondary">Full name</label>
            <input type="text" class="form-control" id="signup-name" autocomplete="name">
        </div>

        <div class="mb-3">
            <label class="form-label text-secondary">Email</label>
            <input type="email" class="form-control" id="signup-email" autocomplete="username">
        </div>

        <div class="mb-3">
            <label class="form-label text-secondary">Role</label>
            <select class="form-select" id="signup-role">
                {% for role in roles %}
                <option value="{{ role }}">{{ role }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label text-secondary">Password</label>
            <input type="password" class="form-control" id="signup-password" autocomplete="new-password">
        </div>

        <div class="mb-3">
            <label class="form-label text-secondary">Confirm password</label>
            <input type="password" class="form-control" id="signup-password-confirm" autocomplete="new-password">
        </div>

        <button class="btn btn-primary w-100" id="signup-submit">
            Create account
        </button>

        <div class="text-secondary small mt-3">
            New accounts are created with <strong>Pending</strong> status and need
            approval from an existing admin/owner before they can log in.
        </div>

        <div class="text-secondary small mt-4 text-center">
            Already have an account? <a href="/login">Sign in</a>
        </div>

    </div>

    <script src="/static/js/signup.js"></script>

</body>

</html>
