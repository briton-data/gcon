<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — GCON</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>

<body class="gcon-login-body">

    <div class="gcon-login-card">

        <div class="text-center mb-4">
            <i class="bi bi-diagram-3-fill" style="font-size: 2rem; color: var(--primary);"></i>
            <h4 class="mt-2 mb-0 text-white">GCON</h4>
            <div class="text-secondary small">Choose a new password</div>
        </div>

        <div id="reset-error" class="alert alert-danger d-none"></div>
        <div id="reset-success" class="alert alert-success d-none"></div>

        <input type="hidden" id="reset-token" value="{{ token }}">

        <div class="mb-3">
            <label class="form-label text-secondary">New password</label>
            <input type="password" class="form-control" id="reset-password" autocomplete="new-password">
        </div>

        <div class="mb-3">
            <label class="form-label text-secondary">Confirm new password</label>
            <input type="password" class="form-control" id="reset-password-confirm" autocomplete="new-password">
        </div>

        <button class="btn btn-primary w-100" id="reset-submit">
            Reset password
        </button>

        <div class="text-secondary small mt-4 text-center">
            <a href="/login">Back to sign in</a>
        </div>

    </div>

    <script src="/static/js/reset_password.js"></script>

</body>

</html>
