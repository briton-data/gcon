<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — GCON</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">

    <!--
        Everything below is hardcoded (not CSS custom properties from
        dashboard.css) on purpose: this page needs to look right even
        if dashboard.css's :root variables fail to apply for any
        reason. No card/box container -- logo, form, and links sit
        directly on the page background. Font sizes are bumped up
        (~2px) across every text element on this page per request.
    -->
    <style>
        html, body {
            height: 100%;
        }

        .gcon-login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0B0D10;
            padding: 24px;
        }

        .gcon-login-wrap {
            width: 100%;
            max-width: 380px;
        }

        .gcon-login-logo {
            display: block;
            height: 64px;
            width: auto;
            margin: 0 auto;
        }

        .gcon-login-subtitle {
            color: #C9CDD4;
            font-size: 1.0625rem;
            margin-top: 10px;
        }

        .gcon-login-wrap label {
            color: #C9CDD4;
            font-size: 1.0625rem;
            margin-bottom: 6px;
        }

        .gcon-login-wrap .form-control {
            background-color: #1B1F26 !important;
            border: 1px solid rgba(255, 255, 255, 0.16) !important;
            color: #F4F5F7 !important;
            font-size: 1.0625rem !important;
            padding: 10px 14px;
            border-radius: 10px;
        }

        .gcon-login-wrap .form-control::placeholder {
            color: #8A8F9B;
        }

        .gcon-login-wrap .form-control:focus {
            border-color: #00C2A8 !important;
            box-shadow: 0 0 0 .2rem rgba(0, 194, 168, .18) !important;
        }

        /* Chrome/Edge paint autofilled fields with their own light-blue
           background that ignores background-color -- this overrides
           it via the long-transition trick so autofill still looks
           like the rest of the dark form instead of a jarring white/
           blue box. */
        .gcon-login-wrap .form-control:-webkit-autofill,
        .gcon-login-wrap .form-control:-webkit-autofill:hover,
        .gcon-login-wrap .form-control:-webkit-autofill:focus {
            -webkit-text-fill-color: #F4F5F7;
            -webkit-box-shadow: 0 0 0 1000px #1B1F26 inset;
            transition: background-color 9999s ease-in-out 0s;
        }

        .gcon-password-wrap {
            position: relative;
        }

        .gcon-password-wrap .form-control {
            padding-right: 44px;
        }

        .gcon-password-toggle {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: #8A8F9B;
            font-size: 1.15rem;
            cursor: pointer;
        }

        .gcon-password-toggle:hover {
            color: #F4F5F7;
        }

        .gcon-login-wrap a {
            font-size: 1.0625rem;
            color: #C9CDD4;
        }

        .gcon-login-wrap a.gcon-link-accent {
            color: #00C2A8;
        }

        #login-submit {
            background-color: #00C2A8 !important;
            border-color: #00C2A8 !important;
            color: #0B0D10 !important;
            font-size: 1.125rem !important;
            font-weight: 600;
            padding: 10px 0;
            border-radius: 10px;
        }

        #login-submit:hover {
            background-color: #14B8A6 !important;
            border-color: #14B8A6 !important;
        }

        #login-error {
            font-size: 1.0625rem;
        }

        .gcon-login-footer {
            font-size: 1.0625rem;
            color: #C9CDD4;
        }
    </style>
</head>

<body class="gcon-login-body">

    <div class="gcon-login-wrap">

        <div class="text-center mb-4">
            <img src="/static/img/gcon-logo.png" alt="GCON" class="gcon-login-logo">
            <div class="gcon-login-subtitle">Sign in to the cluster dashboard</div>
        </div>

        <div id="login-error" class="alert alert-danger d-none"></div>

        <div class="mb-3">
            <label for="login-email">Email</label>
            <input type="email" class="form-control" id="login-email" autocomplete="username">
        </div>

        <div class="mb-3">
            <label for="login-password">Password</label>
            <div class="gcon-password-wrap">
                <input type="password" class="form-control" id="login-password" autocomplete="current-password">
                <button type="button" class="gcon-password-toggle" id="login-password-toggle"
                        aria-label="Show password" title="Show password">
                    <i class="bi bi-eye-fill" id="login-password-toggle-icon"></i>
                </button>
            </div>
        </div>

        <div class="d-flex justify-content-end mb-3">
            <a href="/forgot-password">Forgot password?</a>
        </div>

        <button class="btn w-100" id="login-submit">
            Sign In
        </button>

        <div class="gcon-login-footer mt-4 text-center">
            Don't have an account? <a href="/signup" class="gcon-link-accent">Create one</a>
        </div>

    </div>

    <script src="/static/js/login.js"></script>

</body>

</html>
