[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcon"
version = "0.1.0"
description = "Verified execution infrastructure: cryptographic proof of what actually happened when a job or an AI agent runs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "GCON Contributors", email = "contact@gcon.network"}
]
keywords = [
    "verification",
    "attestation",
    "distributed-computing",
    "ai-agents",
    "provenance",
    "ai",
    "ml"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing"
]

dependencies = [
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
    "cryptography>=45.0.0",
    "fastapi",
    "pydantic",
    "uvicorn[standard]",
    "jinja2",
    "websockets",
    "grpcio>=1.82.1",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.990",
    "httpx2"
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0"
]

[project.urls]
"Homepage" = "https://github.com/briton-data/gcon"
"Bug Tracker" = "https://github.com/briton-data/gcon/issues"
"Documentation" = "https://gcon.network/docs"
"Repository" = "https://github.com/briton-data/gcon.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "stress_test1.py", "stress_test2.py", "smoke_management_gaps.py"]
norecursedirs = ["support", ".git", "*.egg-info"]
addopts = "-v --cov=gcon --cov-report=html"
markers = [
    "slow: marks tests as slow (run explicitly, not part of the default fast suite)",
]
